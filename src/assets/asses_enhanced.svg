<svg width="400" height="420" viewBox="0 0 400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left diamond gradient: warm gold/amber -->
    <linearGradient id="leftDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F4A623"/>
    </linearGradient>
    <!-- Right diamond gradient: cyan/teal -->
    <linearGradient id="rightDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#118AB2"/>
    </linearGradient>
    <!-- Overlap area gradient -->
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#44A3AA" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Checkmark gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#118AB2"/>
      <stop offset="50%" stop-color="#06D6A0"/>
      <stop offset="100%" stop-color="#F4A623"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
    <!-- Glow filter for text -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(17,138,178,0.25)"/>
    </filter>
  </defs>

  <!-- LEFT DIAMOND (warm gold) — rotated square -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="155" height="155" rx="18" ry="18"
          fill="url(#leftDiamond)"
          transform="rotate(45 137.5 197.5)"/>
  </g>

  <!-- RIGHT DIAMOND (cyan/teal) — rotated square, overlapping -->
  <g filter="url(#shadow)">
    <rect x="185" y="120" width="155" height="155" rx="18" ry="18"
          fill="url(#rightDiamond)"
          transform="rotate(45 262.5 197.5)"/>
  </g>

  <!-- CHECKMARK / ARROW on the right diamond -->
  <!-- A bold check mark in white, centered on the right diamond -->
  <polyline
    points="215,195 242,222 295,162"
    stroke="url(#checkGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.95"/>

  <!-- Arabic text: أسس -->
  <!-- Using a system Arabic font, bold, gradient fill -->
  <text
    x="200"
    y="370"
    text-anchor="middle"
    font-family="'Segoe UI', 'Noto Naskh Arabic', 'Arabic UI Display', 'Arabic', sans-serif"
    font-size="88"
    font-weight="700"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
    letter-spacing="2">أسس</text>
</svg>
